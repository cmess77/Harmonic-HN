name: fork-android-release

# Android-only release for forks. A push to a release branch or an android-v* tag (or a
# manual run) builds the FOSS APK and attaches it to a GitHub release. Branch pushes create
# their own tag, android-v<versionName>-<run>, through the API. The upstream tag.yml also
# builds desktop packages and requires signing secrets, so it is left untouched.
on:
  push:
    branches:
      - main
      - 'ccr-*'
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example android-v1.2)
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      UNSIGNED_APK: app/build/outputs/apk/fossRelease/app-fossRelease-unsigned.apk
      ALIGNED_APK: app/build/outputs/apk/fossRelease/app-aligned.apk
      SIGNED_APK: app/build/outputs/apk/fossRelease/Harmonic-HN.apk
    steps:
      - uses: actions/checkout@v7
      - name: Choose release tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(sed -n 's/^harmonic.versionName=//p' gradle.properties)"
            tag="android-v${version}-${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Install NDK for stripping packaged native libraries
        run: sdkmanager "ndk;29.0.13113456"
      - name: Build release APK
        run: ./gradlew :app:assembleFossRelease --warning-mode all --no-daemon --max-workers=2
      - name: Sign APK
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          if [[ -n "$ANDROID_SIGNING_KEYSTORE_BASE64" && -n "$ANDROID_SIGNING_KEYSTORE_PASSWORD" && -n "$ANDROID_SIGNING_KEY_ALIAS" && -n "$ANDROID_SIGNING_KEY_PASSWORD" ]]; then
            echo "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          else
            echo "::warning::Signing secrets are not set. Using a throwaway key, so each release has a different signature and cannot update the previous install in place."
            ANDROID_SIGNING_KEYSTORE_PASSWORD=android
            ANDROID_SIGNING_KEY_PASSWORD=android
            ANDROID_SIGNING_KEY_ALIAS=throwaway
            keytool -genkeypair -noprompt -keystore "$KEYSTORE_PATH" \
              -storepass android -keypass android -alias throwaway \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Harmonic HN fork"
          fi
          export ANDROID_SIGNING_KEYSTORE_PASSWORD ANDROID_SIGNING_KEY_PASSWORD
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_SIGNING_KEY_ALIAS" \
            --ks-pass env:ANDROID_SIGNING_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_SIGNING_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$SIGNED_APK"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.SIGNED_APK }}
          generate_release_notes: true
